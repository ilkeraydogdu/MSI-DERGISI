[package]
name = "msi-dergisi-platform"
version = "2.6.0"
edition = "2021"
authors = ["UMSA Prodüksiyon - MSI Dergisi & MSI TDR Digital Architecture"]
description = "MSI Dergisi & MSI TDR (savunmahaber.com / msidergisi.com) Fullstack Rust Web Platform, OMS/CMS & B2B Defense Analytics Engine"

[lib]
name = "msi_dergisi_platform"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-full", "trace", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"
regex = "1.10"
once_cell = "1.19"
argon2 = "0.5"
hmac = "0.12"
ammonia = "4"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
tokio-util = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

