[package]
name = "msi-dergisi-platform"
version = "2.6.0"
edition = "2021"
authors = ["UMSA Prodüksiyon - MSI Dergisi & MSI TDR Digital Architecture"]
description = "MSI Dergisi & MSI TDR (savunmahaber.com / msidergisi.com) Fullstack Rust Web Platform, OMS/CMS & Embedded Editorial WASM Studio"

[lib]
name = "msi_dergisi_platform"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "msi-dergisi-platform"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
server = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:rusqlite",
    "dep:chrono",
    "dep:uuid",
    "dep:sha2",
    "dep:hex",
    "dep:ring",
    "dep:flate2",
    "dep:dotenvy",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:urlencoding",
    "dep:regex",
    "dep:once_cell",
    "dep:argon2",
    "dep:hmac",
    "dep:ammonia",
    "dep:image",
    "dep:rand_core",
    "dep:sha1",
    "dep:reqwest",
    "dep:base64",
    "dep:tokio-util",
    "dep:r2d2",
    "dep:r2d2_sqlite",
    "dep:rusqlite_migration",
    "dep:serde_urlencoded",
    "dep:totp-rs",
    "dep:qrcode",
    "dep:libc",
]
editorial-wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]

[dependencies]
# Shared dependencies (used by native server, shared editorial core, and WASM studio)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# Native server dependencies
axum = { version = "0.7", features = ["macros", "multipart"], optional = true }
tokio = { version = "1.40", features = ["full"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-full", "trace", "set-header"], optional = true }
rusqlite = { version = "0.32", features = ["bundled", "backup"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
uuid = { version = "1.10", features = ["v4", "serde"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
ring = { version = "0.17", optional = true }
flate2 = { version = "1.1", optional = true }
dotenvy = { version = "0.15", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
urlencoding = { version = "2.1", optional = true }
regex = { version = "1.10", optional = true }
once_cell = { version = "1.19", optional = true }
argon2 = { version = "0.5", optional = true }
hmac = { version = "0.12", optional = true }
ammonia = { version = "4", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
sha1 = { version = "0.10", optional = true }
reqwest = { version = "0.12", features = ["json", "multipart", "gzip", "brotli"], optional = true }
base64 = { version = "0.22", optional = true }
tokio-util = { version = "0.7", optional = true }
r2d2 = { version = "0.8", optional = true }
r2d2_sqlite = { version = "0.25", optional = true }
rusqlite_migration = { version = "1", optional = true }
serde_urlencoded = { version = "0.7.1", optional = true }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"], optional = true }
qrcode = { version = "0.14", optional = true }
libc = { version = "0.2.191", optional = true }

# Pure Rust WebAssembly editorial client dependencies
wasm-bindgen = { version = "=0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.50", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlImageElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "File",
    "FileList",
    "FormData",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "NodeList",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "Storage",
    "Location",
    "DomTokenList",
    "CssStyleDeclaration",
    "DomRect",
    "Selection",
    "Range",
    "HtmlDocument",
    "ClipboardEvent",
    "DataTransfer",
    "Node",
    "Request",
    "RequestInit",
    "RequestCredentials",
    "Headers",
    "Response",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
